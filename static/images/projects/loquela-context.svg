<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
  <title id="title">Loquela contextual learning preview</title>
  <desc id="desc">A green Loquela panel with a language lookup for sobremesa and a contextual example sentence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#052d1b" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="760" height="900" fill="#126a3f"/>
  <g fill="none" stroke="#63a57e" stroke-width="38" opacity=".2">
    <circle cx="770" cy="40" r="210"/>
    <circle cx="-18" cy="850" r="210"/>
    <circle cx="390" cy="920" r="230"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fffaf0">
    <text x="78" y="128" font-size="15" font-weight="700" letter-spacing="2.4">FROM CONVERSATION TO COMPREHENSION</text>
    <text x="78" y="190" font-family="Georgia, serif" font-size="48" font-weight="700">Your reading becomes</text>
    <text x="78" y="248" font-family="Georgia, serif" font-size="48" font-weight="700">a personal language</text>
    <text x="78" y="306" font-family="Georgia, serif" font-size="48" font-weight="700">corpus.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="88" y="360" width="584" height="424" rx="30" fill="#faf8f1" transform="rotate(-2 380 572)"/>
    <g font-family="Arial, Helvetica, sans-serif" transform="rotate(-2 380 572)">
      <circle cx="132" cy="415" r="22" fill="#126a3f"/>
      <text x="132" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">WA</text>
      <text x="169" y="413" font-size="17" font-weight="700" fill="#171b2e">Loquela</text>
      <text x="169" y="433" font-size="12" fill="#5d6473">online</text>
      <rect x="126" y="466" width="480" height="48" rx="15" fill="#f6f8fc" stroke="#d5dce9"/>
      <text x="148" y="496" font-size="15" fill="#171b2e">LOOKUP sobremesa</text>
      <rect x="126" y="536" width="368" height="73" rx="15" fill="#dcefeb"/>
      <text x="148" y="564" font-size="16" font-weight="700" fill="#171b2e">sobremesa · noun</text>
      <text x="148" y="588" font-size="13" fill="#303744">The time spent talking together</text>
      <text x="148" y="606" font-size="13" fill="#303744">after a meal.</text>
      <rect x="126" y="631" width="430" height="111" rx="15" fill="#dcefeb"/>
      <rect x="148" y="649" width="118" height="26" rx="13" fill="#f5d990"/>
      <text x="207" y="667" text-anchor="middle" font-size="11" font-weight="700" fill="#6c4e12">From your source</text>
      <text x="148" y="700" font-family="Georgia, serif" font-size="14" fill="#303744">“La sobremesa se alargó hasta bien</text>
      <text x="148" y="722" font-family="Georgia, serif" font-size="14" fill="#303744">entrada la noche.”</text>
    </g>
  </g>
</svg>
