<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Loquela contextual learning preview</title>
  <desc id="desc">A wide Loquela preview showing the language corpus message alongside a lookup for sobremesa.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#052d1b" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="#126a3f"/>
  <g fill="none" stroke="#63a57e" stroke-width="32" opacity=".2">
    <circle cx="1190" cy="28" r="190"/>
    <circle cx="18" cy="672" r="170"/>
    <circle cx="680" cy="730" r="210"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fffaf0">
    <text x="76" y="138" font-size="14" font-weight="700" letter-spacing="2.1">FROM CONVERSATION TO COMPREHENSION</text>
    <text x="76" y="190" font-family="Georgia, serif" font-size="42" font-weight="700">Your reading</text>
    <text x="76" y="241" font-family="Georgia, serif" font-size="42" font-weight="700">becomes a</text>
    <text x="76" y="292" font-family="Georgia, serif" font-size="42" font-weight="700">personal language</text>
    <text x="76" y="343" font-family="Georgia, serif" font-size="42" font-weight="700">corpus.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="620" y="118" width="500" height="452" rx="28" fill="#faf8f1" transform="rotate(-2 870 344)"/>
    <g font-family="Arial, Helvetica, sans-serif" transform="rotate(-2 870 344)">
      <circle cx="664" cy="174" r="21" fill="#126a3f"/>
      <text x="664" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">WA</text>
      <text x="700" y="172" font-size="16" font-weight="700" fill="#171b2e">Loquela</text>
      <text x="700" y="191" font-size="11" fill="#5d6473">online</text>
      <rect x="658" y="223" width="424" height="43" rx="14" fill="#f6f8fc" stroke="#d5dce9"/>
      <text x="680" y="250" font-size="14" fill="#171b2e">LOOKUP sobremesa</text>
      <rect x="658" y="286" width="350" height="72" rx="14" fill="#dcefeb"/>
      <text x="680" y="313" font-size="15" font-weight="700" fill="#171b2e">sobremesa · noun</text>
      <text x="680" y="336" font-size="12" fill="#303744">The time spent talking together</text>
      <text x="680" y="353" font-size="12" fill="#303744">after a meal.</text>
      <rect x="658" y="380" width="404" height="112" rx="14" fill="#dcefeb"/>
      <rect x="680" y="398" width="113" height="25" rx="12" fill="#f5d990"/>
      <text x="736" y="415" text-anchor="middle" font-size="10" font-weight="700" fill="#6c4e12">From your source</text>
      <text x="680" y="449" font-family="Georgia, serif" font-size="13" fill="#303744">“La sobremesa se alargó hasta bien</text>
      <text x="680" y="470" font-family="Georgia, serif" font-size="13" fill="#303744">entrada la noche.”</text>
    </g>
  </g>
</svg>
